[project]
name = "customer_name_validation"
authors = [
    { name = "Croco IT", email = "info@crocoit.com" }
]
description = "Enforces that Customer names contain only letters (any script) plus spaces, hyphens, apostrophes and periods — no digits, no leading spaces, no other symbols."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
